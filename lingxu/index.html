<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>凌虚 · 御剑凌云</title>
<style>
body{font-family:"PingFang SC",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;margin:0;background:#192e2c;color:#fff;text-align:center}
h1{font-size:34px;font-weight:700;margin:0 0 8px}
p{color:#9fb8b5;margin:0 0 28px;font-size:14px}
button{font-size:16px;padding:14px 34px;margin:6px;border-radius:12px;border:1px solid #3f5a57;
  background:#223c39;color:#e8f2f1;cursor:pointer;transition:transform .15s,background .15s}
button:hover{background:#2c4a47;transform:translateY(-1px)}
button.primary{background:#a74130;border-color:#a74130;color:#fff0d6;font-weight:700}
.small{font-size:12px;color:#6d8784;margin-top:20px}
</style>
</head>
<body>
<h1>凌虚 · 御剑凌云</h1>
<p>正在为你选择合适的版本……</p>
<button class="primary" onclick="location.href='mobile/'">📱 手机版</button>
<button onclick="location.href='desktop/'">🖥️ 桌面版</button>
<div class="small">通常无需手动选择——页面会自动跳转</div>
<script>
(function(){
  var isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  var isSmall = Math.min(screen.width, screen.height) <= 500;
  var isMobileUA = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
  if (isMobileUA || (isTouchDevice && isSmall)) {
    document.querySelector('p').textContent = '检测到移动设备，正在进入手机版……';
    setTimeout(function(){ location.replace('mobile/'); }, 600);
  } else {
    document.querySelector('p').textContent = '桌面环境，正在进入完整版……';
    setTimeout(function(){ location.replace('desktop/'); }, 600);
  }
})();
</script>
</body>
</html>
