<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mayf3 游戏屋</title>
<style>
:root{--ink:#1f2937;--subtle:#6b7280;--accent:#2563eb;--border:#e2dfd6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Noto Sans SC",sans-serif;color:var(--ink);min-height:100vh;
  background:
    radial-gradient(circle 420px at -40px -60px, rgba(59,130,246,.10), transparent 70%),
    radial-gradient(circle 400px at calc(100% + 60px) calc(100% + 40px), rgba(242,166,64,.12), transparent 70%),
    radial-gradient(120% 130% at 50% 30%, #fdfcf9 0%, #f4f1e8 55%, #e8e2d5 100%);
  background-attachment:fixed;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:24px}
h1{font-size:44px;font-weight:800;letter-spacing:2px}
h1 .en{color:var(--accent)}
.subtitle{color:var(--subtle);margin:10px 0 34px;font-size:16px;letter-spacing:.1em}
.cards{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;max-width:820px}
.card{display:block;width:360px;background:#fff;border:1px solid var(--border);border-bottom-width:4px;
  border-radius:18px;padding:26px 28px;text-decoration:none;color:var(--ink);
  box-shadow:0 8px 26px rgba(46,41,26,.10);transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 14px 34px rgba(37,99,235,.18)}
.card .icon{font-size:44px;margin-bottom:12px}
.card h2{font-size:22px;margin-bottom:8px}
.card p{font-size:14px;color:var(--subtle);line-height:1.7}
.card .go{display:inline-block;margin-top:14px;color:var(--accent);font-weight:700;font-size:14px}
.footer{margin-top:40px;color:#b9b2a4;font-size:12px}
</style>
</head>
<body>
<h1><span class="en">Mayf3</span> 游戏屋</h1>
<div class="subtitle">// 自制小游戏 · 直接开玩 //</div>
<div class="cards">
  <a class="card" href="/agent-life/">
    <div class="icon">🧑‍💻🤖</div>
    <h2>Agent 人生</h2>
    <p>AI Agent 被坑体验模拟器。你在用 agent 干活，它在每个你没盯的地方挖坑——每个坑点前做出选择，搞笑皮+教育核。12 天交付挑战，三条成功路线。</p>
    <span class="go">开始人生 →</span>
  </a>
  <a class="card" href="/lingxu/">
    <div class="icon">🗡️☁️</div>
    <h2>凌虚 · 御剑凌云</h2>
    <p>御剑飞行。实机飞行模型驱动的修仙飞行体验——起风、爬升、穿云，手感优先。</p>
    <span class="go">拔剑起航 →</span>
  </a>
</div>
<div class="footer">v1 · 更多游戏制作中</div>
</body>
</html>
